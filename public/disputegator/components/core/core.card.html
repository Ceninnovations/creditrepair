<!-- @dsCard group="Components" viewport="700x430" name="Core — Buttons, Badges, Cards, Icons" subtitle="Primary controls, status pills, surfaces & the icon set" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { background: var(--bg); padding: 22px; }
  .wrap { display: flex; flex-direction: column; gap: 20px; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 9px; }
  .grp { background: #fff; border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh-card); padding: 18px 20px; }
  .iconwrap { display: grid; grid-template-columns: repeat(12, 1fr); gap: 14px; color: var(--ink-2); }
  .iconwrap span { display: grid; place-items: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Badge, Card, Icon } = window.DisputeGatorDesignSystem_dde977;
  const ICONS = ['shield','fileText','uploadCloud','scale','checkCircle','xCircle','alert','info','trending','gauge','copy','download','print','lock','home','clock','layers','checkSquare','sparkle','user','calendar','hash','percent','refresh'];
  function Demo() {
    return (
      <div className="wrap">
        <div className="grp">
          <div className="lbl">Buttons</div>
          <div className="row">
            <Button variant="primary" icon="sparkle">Analyze My Report</Button>
            <Button variant="ghost" icon="refresh">New Analysis</Button>
            <Button variant="outline" icon="download">Download</Button>
            <Button variant="primary" size="sm">Confirm</Button>
            <Button variant="primary" loading>Analyzing…</Button>
          </div>
        </div>
        <div className="grp">
          <div className="lbl">Badges — priority, strength & rating</div>
          <div className="row">
            <Badge tone="high">High</Badge>
            <Badge tone="medium">Medium</Badge>
            <Badge tone="low">Low</Badge>
            <Badge tone="strong">Strong</Badge>
            <Badge tone="moderate">Moderate</Badge>
            <Badge tone="weak">Weak</Badge>
            <Badge tone="fair">Fair</Badge>
            <Badge tone="positive" icon="trending">Impact: Positive</Badge>
          </div>
        </div>
        <div className="grp">
          <div className="lbl">Icon set — Lucide-style, 2px stroke</div>
          <div className="iconwrap">
            {ICONS.map((n) => <span key={n} title={n}><Icon name={n} size={22} /></span>)}
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
