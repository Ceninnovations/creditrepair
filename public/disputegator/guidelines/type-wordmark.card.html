<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 24px; font-family: var(--font-ui); display: flex; align-items: center; gap: 40px; flex-wrap: wrap; }
  .mark { font-family: var(--font-wordmark); font-weight: 900; letter-spacing: var(--track-wordmark); line-height: 1; }
  .big { font-size: 44px; }
  .b-dispute { color: var(--ink); } .b-gator { color: var(--gator); }
  .meta { font-size: 12.5px; color: var(--ink-3); line-height: 1.7; }
  .meta b { color: var(--ink); }
</style></head>
<body>
  <div class="mark big"><span class="b-dispute">DISPUTE</span><span class="b-gator">GATOR</span></div>
  <div class="meta">
    Font: <b>Plus Jakarta Sans</b> (black, all-caps)<br/>
    Weight <b>900</b> · tracking <b>-.01em</b> · always all-caps<br/>
    DISPUTE in <b>ink</b> · GATOR in <b>gator green #53a02c</b>
  </div>
</body></html>
