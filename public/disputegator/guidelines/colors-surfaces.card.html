<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="App backdrop, shell, card & inset panel" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 20px; font-family: var(--font-ui); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; height: 96px; border-radius: 12px; border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; color: var(--ink); }
  .n { font-size: 12px; font-weight: 700; }
  .h { font-size: 11px; font-family: var(--font-mono); color: var(--ink-3); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--bg);"><span class="n">bg</span><span class="h">#e9edf5 · app backdrop</span></div>
    <div class="sw" style="background:var(--shell);"><span class="n">shell</span><span class="h">#fbfcfe</span></div>
    <div class="sw" style="background:var(--card);"><span class="n">card</span><span class="h">#ffffff</span></div>
    <div class="sw" style="background:var(--card-soft);"><span class="n">card-soft</span><span class="h">#f7f9fc · inset</span></div>
  </div>
</body></html>
