<!-- @dsCard group="Brand" viewport="700x200" name="App Mark & Lockup" subtitle="Gator shield mark + DISPUTEGATOR wordmark on light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 24px; font-family: var(--font-ui); display: flex; gap: 18px; align-items: stretch; }
  .panel { flex: 1; border-radius: 16px; display: flex; align-items: center; gap: 13px; padding: 22px 24px; }
  .light { background: #fff; border: 1px solid var(--border); }
  .dark { background: var(--gator-dark); }
  .mark { width: 44px; height: 44px; flex: none; }
  .wm { font-family: var(--font-wordmark); font-weight: 900; font-size: 20px; letter-spacing: -.01em; line-height: 1; }
  .b-gator { color: var(--gator); }
</style></head>
<body>
  <div class="panel light">
    <img class="mark" src="../assets/mark.png" alt="mark" />
    <span class="wm"><span style="color:var(--ink);">DISPUTE</span><span class="b-gator">GATOR</span></span>
  </div>
  <div class="panel dark">
    <img class="mark" src="../assets/mark.png" alt="mark" />
    <span class="wm"><span style="color:#fff;">DISPUTE</span><span class="b-gator">GATOR</span></span>
  </div>
</body></html>
