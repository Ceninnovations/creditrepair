<!-- @dsCard group="Type" viewport="700x170" name="Numerics" subtitle="Tabular figures — credit scores & stat headline" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 24px; font-family: var(--font-ui); display: flex; gap: 48px; align-items: center; flex-wrap: wrap; }
  .col { text-align: center; }
  .meta { font-size: 11px; font-family: var(--font-mono); color: var(--muted); margin-top: 8px; }
</style></head>
<body>
  <div class="col">
    <div class="tnum" style="font-size:40px;font-weight:800;color:var(--green-600);letter-spacing:-.01em;line-height:1.1;">655</div>
    <div style="font-size:13px;font-weight:600;color:var(--ink-2);">Equifax · Fair</div>
    <div class="meta">score · 40 / 800 / tnum</div>
  </div>
  <div class="col">
    <div class="tnum" style="font-size:36px;font-weight:900;color:var(--ink);letter-spacing:-.02em;line-height:1.1;">50–120 <span style="font-size:22px;">pts</span></div>
    <div style="font-size:12.5px;color:var(--green-600);font-weight:600;margin-top:4px;">Estimated improvement</div>
    <div class="meta">stat · 36 / 900 / tnum</div>
  </div>
  <div class="col">
    <div class="tnum" style="font-size:26px;font-weight:800;color:var(--ink);">64<span style="font-size:15px;">%</span></div>
    <div style="font-size:11.5px;color:var(--ink-3);">Credit Health</div>
    <div class="meta">donut · 26 / 800 / tnum</div>
  </div>
</body></html>
