<!-- @dsCard group="Colors" viewport="700x160" name="Semantic" subtitle="Success / danger / warning with tint backgrounds" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 20px; font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .cell { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .solid { height: 56px; display: flex; align-items: flex-end; padding: 8px 12px; color: #fff; font-size: 12px; font-weight: 700; }
  .tint { height: 40px; display: flex; align-items: center; padding: 0 12px; font-size: 11.5px; font-weight: 600; }
  .h { font-family: var(--font-mono); font-weight: 500; opacity: .85; margin-left: auto; }
</style></head>
<body>
  <div class="grid">
    <div class="cell"><div class="solid" style="background:var(--green);">Success <span class="h">#16a34a</span></div><div class="tint" style="background:var(--green-bg);color:var(--green);">green-bg <span class="h">#dcfce7</span></div></div>
    <div class="cell"><div class="solid" style="background:var(--red);">Danger <span class="h">#dc2626</span></div><div class="tint" style="background:var(--red-bg);color:var(--red);">red-bg <span class="h">#fde8e8</span></div></div>
    <div class="cell"><div class="solid" style="background:var(--amber);">Warning <span class="h">#b45309</span></div><div class="tint" style="background:var(--amber-bg);color:var(--amber);">amber-bg <span class="h">#fdf0d5</span></div></div>
  </div>
</body></html>
