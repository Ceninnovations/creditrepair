<!-- @dsCard group="Colors" viewport="700x150" name="Credit Bureaus" subtitle="Experian / Equifax / TransUnion brand colors" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 20px; font-family: var(--font-ui); }
  .row { display: flex; gap: 16px; }
  .cell { flex: 1; display: flex; align-items: center; gap: 14px; border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .mark { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; font-size: 18px; letter-spacing: -.02em; flex: none; }
  .n { font-size: 14px; font-weight: 700; color: var(--ink); }
  .h { font-size: 11.5px; font-family: var(--font-mono); color: var(--ink-3); margin-top: 2px; }
</style></head>
<body>
  <div class="row">
    <div class="cell"><span class="mark" style="background:var(--experian);">EX</span><div><div class="n">Experian</div><div class="h">#2f6df0</div></div></div>
    <div class="cell"><span class="mark" style="background:var(--equifax);">EQ</span><div><div class="n">Equifax</div><div class="h">#c0202e</div></div></div>
    <div class="cell"><span class="mark" style="background:var(--transunion);">TU</span><div><div class="n">TransUnion</div><div class="h">#1c9aa8</div></div></div>
  </div>
</body></html>
