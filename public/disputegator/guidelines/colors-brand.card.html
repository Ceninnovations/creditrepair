<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Gator Green" subtitle="Primary action greens + logo-matched gator green" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 20px; font-family: var(--font-ui); }
  .row { display: flex; gap: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; }
  .n { font-size: 12px; font-weight: 700; }
  .h { font-size: 11px; font-family: var(--font-mono); opacity: .85; margin-top: 2px; }
  .dark { color: #fff; } .light { color: var(--ink); }
</style></head>
<body>
  <div class="row">
    <div class="sw dark" style="background:var(--green-50);"><span class="n light">green-50</span><span class="h light">#f0fdf4</span></div>
    <div class="sw light" style="background:var(--green-100);"><span class="n">green-100</span><span class="h">#dcfce7</span></div>
    <div class="sw light" style="background:var(--green-200);"><span class="n">green-200</span><span class="h">#bbf7d0</span></div>
    <div class="sw dark" style="background:var(--green-600);"><span class="n">green-600</span><span class="h">#16a34a</span></div>
    <div class="sw dark" style="background:var(--green-700);"><span class="n">green-700</span><span class="h">#15803d</span></div>
    <div class="sw dark" style="background:var(--green-800);"><span class="n">green-800</span><span class="h">#166534</span></div>
    <div class="sw dark" style="background:var(--gator);"><span class="n">gator</span><span class="h">#53a02c</span></div>
  </div>
</body></html>
