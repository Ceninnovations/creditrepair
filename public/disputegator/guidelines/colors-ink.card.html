<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Text" subtitle="Heading → body → caption → muted text scale" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 20px; font-family: var(--font-ui); }
  .row { display: flex; gap: 0; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px 12px; color: #fff; }
  .n { font-size: 12px; font-weight: 700; }
  .h { font-size: 11px; font-family: var(--font-mono); opacity: .85; margin-top: 2px; }
  .sample { font-size: 18px; font-weight: 700; padding: 16px 12px 0; }
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink);"><span class="n">ink</span><span class="h">#0f1b33</span></div>
    <div class="sw" style="background:var(--ink-2);"><span class="n">ink-2</span><span class="h">#475569</span></div>
    <div class="sw" style="background:var(--ink-3);"><span class="n">ink-3</span><span class="h">#64748b</span></div>
    <div class="sw" style="background:var(--ink-4);"><span class="n">ink-4</span><span class="h">#8a97a8</span></div>
    <div class="sw" style="background:var(--muted);"><span class="n">muted</span><span class="h">#94a3b8</span></div>
  </div>
</body></html>
