<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px-based spacing rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: #fff; padding: 24px; font-family: var(--font-ui); }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 7px; }
  .bar { height: 16px; background: var(--green-600); border-radius: 3px; }
  .n { font-size: 11.5px; font-family: var(--font-mono); color: var(--ink-3); width: 110px; }
</style></head>
<body>
  <div class="row"><span class="n">sp-1 · 4px</span><div class="bar" style="width:4px;"></div></div>
  <div class="row"><span class="n">sp-2 · 8px</span><div class="bar" style="width:8px;"></div></div>
  <div class="row"><span class="n">sp-3 · 12px</span><div class="bar" style="width:12px;"></div></div>
  <div class="row"><span class="n">sp-4 · 16px</span><div class="bar" style="width:16px;"></div></div>
  <div class="row"><span class="n">sp-5 · 18px</span><div class="bar" style="width:18px;"></div></div>
  <div class="row"><span class="n">sp-6 · 22px</span><div class="bar" style="width:22px;"></div></div>
  <div class="row"><span class="n">sp-7 · 26px</span><div class="bar" style="width:26px;"></div></div>
  <div class="row"><span class="n">sp-8 · 36px</span><div class="bar" style="width:36px;"></div></div>
</body></html>
